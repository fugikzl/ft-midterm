name: image
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**', 'helm/**', 'docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Argo CD deploys whatever image deploy/image.yaml names.
      - name: Promote image
        run: |
          printf '# Updated by .github/workflows/image.yaml after each published build.\nimage: %s:%s\n' "$IMAGE" "$GITHUB_SHA" > deploy/image.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: university image ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
