doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    options:
      2: 3
  orm:
    controller_resolver:
      auto_mapping: false
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    mappings:
      App:
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: App\Entity
        is_bundle: false
doctrine_migrations:
  migrations_paths:
    DoctrineMigrations: '%kernel.project_dir%/migrations'
