apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [midterm, midterm-baseline, midterm-gateway]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: '(.+)'
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_label_profile]
            target_label: profile
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'rr_.*|go_.*|process_.*|university_.*|envoy_.*'
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://vlogs-victoria-logs-single-server:9428
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: University
        folder: University
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboards}
data:
  roadrunner.json: |
{{ .Files.Get "dashboards/roadrunner.json" | indent 4 }}
  university.json: |
{{ .Files.Get "dashboards/university.json" | indent 4 }}
