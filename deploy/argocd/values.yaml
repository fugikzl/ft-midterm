# Values for the argo-cd chart, used by deploy/bootstrap.sh and the self-managed argocd Application.
global:
  domain: argocd.sailaubek.dev
configs:
  params:
    # TLS terminates at the Envoy edge Gateway (deploy/platform/gateway.yaml).
    server.insecure: true
  cm:
    # Report child Application health so the root app honours sync waves.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    envoyproxy:
      type: helm
      name: envoyproxy
      url: docker.io/envoyproxy
      enableOCI: "true"
dex:
  enabled: false
notifications:
  enabled: false
