apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: university-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/fugikzl/ft-midterm.git
    targetRevision: main
    path: helm/university
    helm:
      releaseName: university
      valueFiles:
        - values-baseline.yaml
        - values-contabo-baseline.yaml
        - ../../deploy/image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: midterm-baseline
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: -1
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
