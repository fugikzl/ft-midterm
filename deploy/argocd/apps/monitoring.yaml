apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/fugikzl/ft-midterm.git
    targetRevision: main
    path: helm/monitoring
    helm:
      releaseName: monitoring
      valueFiles:
        - values-contabo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: midterm-monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: -1
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
